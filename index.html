<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<title>NumeraFlow App</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{--ground:#0b0713;--surface:#160f24;--surface2:#1d1533;--border:#2c2145;--text:#f4f1fa;--muted:#a99fc0;--purple:#a78bfa;--lilac:#d8b4fe;--mint:#6ee7b7;--indigo:#818cf8;--ink:#17111f;--heading:"Manrope",ui-sans-serif,system-ui,sans-serif;--body:"DM Sans",ui-sans-serif,system-ui,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--ground);color:var(--text);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  h1,h2,h3,h4{font-family:var(--heading);font-weight:800;margin:0;text-wrap:balance;line-height:1.1;}
  .aurora{background-image:linear-gradient(120deg,var(--purple),var(--lilac),var(--mint),var(--indigo),var(--purple));background-size:300% 300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:aurora 6s ease infinite;}
  @keyframes aurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  #app{position:relative;z-index:1;min-height:100vh;}
  .screen{animation:fade .45s ease;}
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,3,12,.72);backdrop-filter:blur(4px);}
  .modal.on{display:flex;animation:fade .25s ease;}
  .mbox{position:relative;max-width:400px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 24px 70px -20px #000;}
  .mclose{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:6px;}
  .num-tap{cursor:pointer;}
  .echo{display:inline-block;font-size:.62em;font-weight:700;color:var(--mint);background:rgba(110,231,183,.12);border:1px solid rgba(110,231,183,.35);border-radius:999px;padding:1px 7px;vertical-align:middle;letter-spacing:.02em;}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px;}
  .eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--purple);}
  .muted{color:var(--muted);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--heading);font-weight:700;border-radius:999px;padding:14px 26px;cursor:pointer;border:1px solid transparent;font-size:.98rem;transition:transform .12s ease,background .2s,box-shadow .2s;user-select:none;touch-action:manipulation;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:scale(.95);}
  .btn-primary{background:#fff;color:#0b0713;}
  .btn-glow{background:linear-gradient(120deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 8px 30px -8px rgba(139,92,246,.7);}
  .btn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:#fff;}
  .btn-block{width:100%;}
  input,textarea{width:100%;background:rgba(11,7,19,.6);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px;font-family:var(--body);font-size:1rem;color-scheme:dark;}
  input:focus,textarea:focus{outline:none;border-color:var(--purple);}
  label.fl{display:block;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;}
  .card{border:1px solid var(--border);background:rgba(22,15,36,.6);border-radius:18px;padding:20px;}
  /* topbar */
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:rgba(11,7,19,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .stickyfoot{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:rgba(11,7,19,.9);backdrop-filter:blur(10px);border-top:1px solid var(--border);}
  .logo{display:flex;align-items:center;gap:9px;font-family:var(--heading);font-weight:800;font-size:1.1rem;cursor:pointer;}
  .logo .mk{width:25px;height:25px;border-radius:7px;background:linear-gradient(135deg,var(--purple),var(--mint));display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .top .r{display:flex;gap:8px;align-items:center;}
  /* hero */
  .hero{text-align:center;padding:56px 20px 30px;position:relative;overflow:hidden;}
  .halo{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% -5%,rgba(139,92,246,.30),transparent 65%);pointer-events:none;}
  .hero h1{font-size:clamp(2.5rem,8vw,4.6rem);margin-top:18px;}
  .hero .sub{max-width:560px;margin:18px auto 0;color:var(--muted);font-size:1.1rem;}
  .badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 15px;font-size:.72rem;font-weight:700;color:var(--lilac);}
  /* teaser */
  .teaser{max-width:500px;margin:30px auto 0;text-align:left;}
  .reveal{display:none;margin-top:18px;border-top:1px solid var(--border);padding-top:16px;text-align:center;}
  .reveal.on{display:block;animation:fade .5s ease;}
  .bignum{font-family:var(--heading);font-weight:800;font-size:4.2rem;line-height:1;}
  /* journeys */
  .journeys{display:grid;gap:16px;margin:34px auto 0;max-width:760px;}
  @media(min-width:720px){.journeys{grid-template-columns:1fr 1fr;}}
  .jcard{position:relative;overflow:hidden;border-radius:20px;padding:26px;border:1px solid var(--border);text-align:left;}
  .jcard.me{background:linear-gradient(165deg,rgba(124,58,237,.22),rgba(22,15,36,.7));}
  .jcard.fam{background:linear-gradient(165deg,rgba(110,231,183,.13),rgba(22,15,36,.7));}
  .jcard .price{font-family:var(--heading);font-weight:800;font-size:3rem;margin:8px 0;}
  .jcard ul{list-style:none;margin:14px 0 20px;padding:0;}
  .jcard li{display:flex;gap:9px;color:var(--muted);font-size:.9rem;margin:8px 0;}
  .jcard li b{color:var(--mint);}
  /* progress stages */
  .stages{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 auto 4px;padding:14px 20px 0;}
  .stg{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 10px;}
  .stg.done{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint);border-color:transparent;}
  .stg.now{background:#7c3aed;color:#fff;border-color:#7c3aed;}
  /* option chips */
  .opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .opt{border:1px solid var(--border);background:rgba(255,255,255,.03);border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:600;font-size:.95rem;transition:transform .12s ease,border-color .15s,background .15s;touch-action:manipulation;}
  .opt:hover{border-color:var(--purple);}
  .opt:active{transform:scale(.94);border-color:var(--purple);}
  .opt.sel{background:#7c3aed;border-color:#7c3aed;color:#fff;}
  .say{color:var(--mint);font-style:italic;font-size:.9rem;margin-top:2px;animation:fade .5s ease;}
  /* key numbers */
  .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;}
  @media(min-width:600px){.keys{grid-template-columns:repeat(5,1fr);}}
  .key{border:1px solid var(--border);background:rgba(29,21,51,.6);border-radius:16px;padding:14px 8px;text-align:center;transition:transform .12s ease,border-color .15s;touch-action:manipulation;}
  .key.num-tap:active{transform:scale(.94);border-color:var(--purple);}
  .key .l{font-size:.56rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .key .v{font-family:var(--heading);font-weight:800;font-size:1.9rem;line-height:1;margin-top:6px;}
  /* rail */
  .rail{position:sticky;top:52px;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:rgba(11,7,19,.85);backdrop-filter:blur(8px);border-top:1px solid var(--border);border-bottom:1px solid var(--border);scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .rail button{white-space:nowrap;font-size:.72rem;font-weight:700;color:var(--muted);padding:6px 12px;border-radius:999px;border:0;background:none;cursor:pointer;}
  .rail button.on{background:#3a2d5c;color:var(--text);}
  section.blk{border-top:1px solid rgba(44,33,69,.6);padding:32px 0;scroll-margin-top:110px;}
  .theme{margin-top:10px;}
  .theme .tp{display:flex;justify-content:space-between;align-items:baseline;}
  .track{height:6px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:8px;}
  .fill{height:100%;border-radius:999px;}
  .t-Dominant{color:var(--purple)}.b-Dominant{background:var(--purple)}
  .t-Strong{color:var(--mint)}.b-Strong{background:var(--mint)}
  .t-Supporting{color:var(--lilac)}.b-Supporting{background:var(--lilac)}
  .disc{margin-top:12px;border-top:1px solid rgba(44,33,69,.5);padding-top:10px;}
  .disc summary{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;list-style:none;}
  .disc pre{margin:10px 0 0;background:rgba(11,7,19,.6);border-radius:8px;padding:12px;font-size:.72rem;color:var(--muted);white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;}
  .pin{border:1px solid var(--border);background:rgba(22,15,36,.5);border-radius:14px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .pin.now{border-color:var(--purple);background:var(--surface);}
  .here{background:var(--purple);color:var(--ink);font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:5px 10px;border-radius:999px;}
  /* year wheel */
  .wheel{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .yr{width:46px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface2);font-family:var(--heading);font-weight:800;font-size:1.1rem;}
  .yr small{font-size:.46rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-top:2px;}
  .yr.on{background:var(--purple);color:var(--ink);border-color:var(--purple);}
  .yr.on small{color:var(--ink);}
  .trio{display:grid;gap:10px;margin-top:12px;}
  @media(min-width:600px){.trio{grid-template-columns:repeat(3,1fr);}}
  .trio .t{border:1px solid var(--border);border-radius:12px;padding:13px;background:rgba(22,15,36,.5);}
  .trio .t.mid{border-color:var(--purple);}
  .beam{position:relative;overflow:hidden;}
  .beam::before{content:"";position:absolute;width:64px;height:64px;top:-32px;left:-32px;background:conic-gradient(from 0deg,transparent,var(--purple),var(--mint),transparent);animation:spin 7s linear infinite;opacity:.5;}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* family */
  .fnode{border:1px solid var(--border);background:rgba(22,15,36,.6);border-radius:16px;padding:16px;cursor:pointer;transition:transform .12s ease,border-color .15s;touch-action:manipulation;}
  .fnode:hover{border-color:var(--purple);}
  .fnode:active{transform:scale(.97);}
  .fnode.sel{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple);}
  .foot{text-align:center;color:var(--muted);font-size:.76rem;padding:26px 20px 60px;}
  /* staggered pop-in for repeated grid/list items */
  .jcard{animation:fade .5s ease backwards;transition:transform .12s ease;}
  .jcard:active{transform:scale(.98);}
  .keys .key,.opts .opt,.journeys .jcard,.fnode{animation:fade .4s ease backwards;}
  .keys .key:nth-child(2),.opts .opt:nth-child(2),.journeys .jcard:nth-child(2),.fnode:nth-child(2){animation-delay:.06s}
  .keys .key:nth-child(3),.opts .opt:nth-child(3),.journeys .jcard:nth-child(3),.fnode:nth-child(3){animation-delay:.12s}
  .keys .key:nth-child(4),.opts .opt:nth-child(4),.journeys .jcard:nth-child(4),.fnode:nth-child(4){animation-delay:.18s}
  .keys .key:nth-child(5),.opts .opt:nth-child(5),.fnode:nth-child(5){animation-delay:.24s}
  .keys .key:nth-child(n+6),.opts .opt:nth-child(n+6),.fnode:nth-child(n+6){animation-delay:.3s}
  @media(prefers-reduced-motion:reduce){.aurora,.beam::before{animation:none;}.screen,.jcard,.keys .key,.opts .opt,.journeys .jcard,.fnode{animation:none;}}
</style>

<script>
/* ============================ ENGINE ============================ */
const digitSum=v=>String(Math.abs(Number(v))).split('').reduce((s,d)=>s+ +d,0);
const MFAM={2:11,4:22,6:33};// root -> its master higher-octave (11/22/33 all reduce to 2/4/6)
function reduce(raw,preserve=[]){const route=[+raw];let cur=+raw;while(cur>9&&!preserve.includes(cur)){cur=digitSum(cur);route.push(cur);}const root=cur>9?digitSum(cur):cur;const isMaster=preserve.includes(cur);
 // A compound like 20/2, 29→11→2, 38→11→2 carries the higher-octave master of its family.
 // Flag when it's NOT already a master, came from a double digit, and its family has a master (2/4/6).
 const masterEcho=(!isMaster&&+raw>9&&MFAM[root])?MFAM[root]:null;
 // Strong echo = the reduction literally passed through the master (e.g. 29→11→2) or is a round master-anchor (20/40..).
 const strongEcho=masterEcho&&(route.includes(masterEcho)||+raw===masterEcho*10||(+raw)%10===0)?masterEcho:null;
 // A value that lands on a master with zero reduction steps (e.g. born on the 22nd -> raw 22 is already the master)
 // never shows its root anywhere in the route. Rule: display it as "22/4" so the root is never silently dropped.
 const instantMaster=isMaster&&route.length===1;
 const display=instantMaster?cur+'/'+root:route.join('/');
 return{rawTotal:+raw,route,compound:+raw>9?+raw:null,number:cur,root,master:isMaster,masterEcho,strongEcho,display};}
const MM=[11,22,33];
const PY={};'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((L,i)=>PY[L]=(i%9)+1);
const CHG={1:'AIJQY',2:'BKR',3:'CGLS',4:'DMT',5:'EHNX',6:'UVW',7:'OZ',8:'FP'};const CH={};Object.entries(CHG).forEach(([v,ls])=>ls.split('').forEach(l=>CH[l]=+v));
function classify(name){const out=[];String(name).toUpperCase().split(/\s+/).filter(Boolean).forEach(w=>{const hv=/[AEIOU]/.test(w);w.split('').forEach(ch=>{if(!/[A-Z]/.test(ch))return;let vowel=/[AEIOU]/.test(ch);if(ch==='Y')vowel=!hv;out.push({letter:ch,vowel});});});return out;}
function nameCalc(name,map,pre){const L=classify(name);const val=a=>a.reduce((s,l)=>s+(map[l.letter]||0),0);return{expression:reduce(val(L),pre),soulUrge:reduce(val(L.filter(l=>l.vowel)),pre),personality:reduce(val(L.filter(l=>!l.vowel)),pre)};}
const ANIMALS=['Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat','Monkey','Rooster','Dog','Pig'];
const ELEMENTS=['Metal','Metal','Water','Water','Wood','Wood','Fire','Fire','Earth','Earth'];
function chineseYear(dob,year){let by;try{const p=new Intl.DateTimeFormat('en-u-ca-chinese',{year:'numeric',timeZone:'UTC'}).formatToParts(new Date(dob+'T12:00:00Z'));by=+p.find(x=>x.type==='relatedYear').value;}catch(e){by=+dob.slice(0,4);}const ey=y=>({animal:ANIMALS[((y-4)%12+12)%12],element:ELEMENTS[((y%10)+10)%10],yinYang:y%2===0?'Yang':'Yin',year:y});return{birth:ey(by),forecast:ey(year)};}
const personalYearFor=(m,d,year)=>reduce(reduce(m).root+reduce(d).root+digitSum(year)).root;
// Birth Architecture: Birthday -> Month -> Day+Month -> Birth Year -> Life Path. Every layer is kept, none discarded.
function birthArchitecture(dob){const[y,m,d]=dob.split('-').map(Number);const birthMonth=reduce(m,MM),birthday=reduce(d,MM),dayMonth=reduce(birthMonth.number+birthday.number,MM),birthYear=reduce(digitSum(y),MM),lifePath=reduce(dayMonth.number+birthYear.number,MM);return{birthMonth,birthday,dayMonth,birthYear,lifePath};}
function lifePathFromDob(dob){return birthArchitecture(dob).lifePath;}
function buildProfile(dob,fullName,currentName,door,year){const[y,m,d]=dob.split('-').map(Number);const arch=birthArchitecture(dob);const{birthMonth,birthday,dayMonth,birthYear,lifePath}=arch;const pyth=nameCalc(fullName,PY,MM),chal=nameCalc(fullName,CH,[]);const p1=dayMonth,p2=reduce(birthday.number+birthYear.number,MM);const pinnacles=[p1,p2,reduce(p1.number+p2.number,MM),reduce(birthMonth.number+birthYear.number,MM)];const hn=String(door||'').toUpperCase().replace(/^(FLAT|APARTMENT|APT|UNIT)\s*/i,'').replace(/[^A-Z0-9]/g,'');const home=hn?reduce(hn.split('').reduce((s,ch)=>s+(/\d/.test(ch)?+ch:(PY[ch]||0)),0),MM):null;return{dob,name:fullName,currentName,door,homeNorm:hn,year,lifePath,birthday,birthMonth,dayMonth,birthYear,attitude:reduce(m+d).root,pyth,chal,pinnacles,home,personalYear:personalYearFor(m,d,year),personalYearPrev:personalYearFor(m,d,year-1),personalYearNext:personalYearFor(m,d,year+1),chinese:chineseYear(dob,year),month:m,day:d};}
/* intelligence */
const NP={1:{t:['independence','leadership'],s:['control','impatience'],need:'autonomy',m:'independence, initiative and the nerve to lead'},2:{t:['sensitivity','partnership'],s:['avoidance','over-dependence'],need:'harmony',m:'sensitivity, partnership and emotional intelligence'},3:{t:['expression','creativity'],s:['scattered attention','restlessness'],need:'recognition',m:'expression, creativity and visible communication'},4:{t:['stability','discipline'],s:['rigidity','over-work'],need:'security',m:'structure, discipline and dependable foundations'},5:{t:['freedom','adaptability'],s:['restlessness','scattered attention'],need:'freedom',m:'freedom, change and learning through experience'},6:{t:['responsibility','stability'],s:['over-responsibility','control'],need:'being needed',m:'responsibility, care and the standards held at home'},7:{t:['introspection','sensitivity'],s:['withdrawal','perfectionism'],need:'understanding',m:'analysis, intuition and the need to understand what sits underneath'},8:{t:['ambition','leadership'],s:['control','over-work'],need:'achievement',m:'authority, material lessons and the responsible use of power'},9:{t:['service','sensitivity'],s:['emotional overwhelm','avoidance'],need:'meaning',m:'completion, compassion and the wider human pattern'},11:{t:['sensitivity','expression'],s:['anxiety','over-responsibility'],need:'expression',m:'heightened intuition and the pressure to express insight clearly'},22:{t:['ambition','stability'],s:['over-work','control'],need:'achievement',m:'master-builder energy that must make a large vision practical'},33:{t:['service','responsibility'],s:['self-erasure','over-responsibility'],need:'meaning',m:'compassionate teacher energy that must not erase itself'}};
const LABEL={independence:'Independence',leadership:'Leadership',sensitivity:'Sensitivity',partnership:'Partnership',expression:'Expression',creativity:'Creativity',stability:'Stability',discipline:'Discipline',freedom:'Freedom',adaptability:'Adaptability',responsibility:'Responsibility',introspection:'Introspection',ambition:'Ambition',service:'Service'};
const NEEDL={autonomy:'Autonomy',harmony:'Harmony',recognition:'Recognition',security:'Security',freedom:'Freedom','being needed':'To be needed',understanding:'Understanding',achievement:'Achievement',meaning:'Meaning'};
const THEME_INFO={
 independence:{best:'self-reliant, decisive and able to start things on your own',shadow:'isolation, stubbornness and struggling to ask for help',grow:'let people in without losing your autonomy'},
 leadership:{best:'takes charge, makes the call and carries responsibility for others',shadow:'controlling, and impatient with other people\'s pace',grow:'lead through trust, not just force of will'},
 sensitivity:{best:'emotionally attuned, empathetic and quick to read a room',shadow:'easily overwhelmed and prone to taking things personally',grow:'protect your energy without shutting down your feeling'},
 partnership:{best:'cooperative, diplomatic and able to build deep bonds',shadow:'over-dependence and losing yourself inside a relationship',grow:'stay whole while staying close'},
 expression:{best:'communicates, creates and turns ideas into something visible',shadow:'scattered, superficial, or all talk and no follow-through',grow:'finish what you start and let it go deeper'},
 creativity:{best:'original, playful and endlessly generative',shadow:'restless, unfocused and forever chasing the next novelty',grow:'give your ideas structure so they actually become real'},
 stability:{best:'dependable, grounded and a builder of lasting foundations',shadow:'rigidity, resistance to change and over-caution',grow:'stay solid without getting stuck'},
 discipline:{best:'consistent, hard-working and able to see things through',shadow:'harsh on yourself, and all work with no play',grow:'balance real effort with real rest'},
 freedom:{best:'adaptable, adventurous and a learner through experience',shadow:'restlessness, commitment-shyness and scattered focus',grow:'choose commitments that still feel like freedom'},
 adaptability:{best:'flexible, quick and genuinely thrives in change',shadow:'inconsistency and being hard to pin down',grow:'let a few things stay steady on purpose'},
 responsibility:{best:'caring, reliable and the one who holds things together',shadow:'over-giving, control and quiet martyrdom',grow:'care for others without abandoning yourself'},

 const savedHtml=saved.length?`<div class="card" style="margin-top:14px"><p style="font-family:var(--heading);font-weight:700">Saved pairings</p><div class="opts" style="margin-top:10px">${saved.map((s,i)=>`<span class="opt" data-savedpair="${i}">${esc(s.name)}</span>`).join('')}</div></div>`:'';
 return topbar()+`<div class="screen"><div class="wrap" style="padding:28px 20px 60px;max-width:640px">
  <p class="eyebrow">Who suits you</p><h1 style="font-size:2rem;margin-top:8px">Your best matches</h1>
  <p class="muted" style="margin-top:8px">Based on your Life Path ${p.lifePath.display} and your ${animal} sign — across both systems.</p>
  <div class="card" style="margin-top:18px"><p class="eyebrow" style="color:var(--purple)">By numbers · Life Path ${lp}</p>
   <p style="margin-top:8px">Naturally harmonious Life Paths: <b style="font-family:var(--heading);color:var(--text)">${comp.join(', ')||'you blend widely'}</b></p>
   <div style="margin-top:10px">${comp.map(n=>`<div style="border-top:1px solid var(--border);padding:8px 0"><b>Life Path ${n}</b> <span class="muted" style="font-size:.85rem">— shares ${LABEL[npFor(n).t[0]]||'common ground'}; ${npFor(n).m}.</span></div>`).join('')}</div>
   <p class="muted" style="font-size:.82rem;margin-top:8px">Harmony isn't everything — difference can be the making of a pairing. This is where things flow easiest.</p>
  </div>
  <div class="card" style="margin-top:14px"><p class="eyebrow" style="color:var(--lilac)">By Chinese astrology · ${animal}</p>
   <p style="margin-top:8px">Your trine allies: <b style="font-family:var(--heading);color:var(--text)">${trine.join(' & ')}</b> — natural allies who move at your rhythm.</p>
   <p style="margin-top:8px">Your secret friend: <b style="font-family:var(--heading);color:var(--text)">${secret}</b> — a quietly steadying, protective match.</p>
   <p style="margin-top:8px">Trickiest: <b style="font-family:var(--heading);color:var(--text)">${opposite}</b> — your opposite sign; real friction, but it keeps you honest.</p>
  </div>
  ${savedHtml}
  <div class="card" style="margin-top:14px"><p style="font-family:var(--heading);font-weight:700">Check anyone</p><p class="muted" style="font-size:.85rem;margin-top:4px">Enter a name and birth date for a full pairing reading — numbers, timing and Chinese astrology together.</p><div style="display:grid;gap:10px;margin-top:12px"><input id="cw_name" value="${esc(cw.name)}" placeholder="Their name"><input id="cw_dob" type="date" value="${esc(cw.dob)}" max="${YEARNOW}-12-31"></div><button class="btn btn-glow btn-block" style="margin-top:12px" data-act="test-compat">See our compatibility</button></div>
  ${pairing}
  <p style="margin-top:22px"><span class="muted" style="cursor:pointer;text-decoration:underline;font-size:.85rem" data-act="dashboard">Back</span></p>
 </div></div>`;}

/* ============================ EVENTS ============================ */
function readMe(){}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  const opt=e.target.closest('[data-opt]');
  const rel=e.target.closest('[data-rel]');
  const rail=e.target.closest('[data-rail]');
  const fsel=e.target.closest('[data-fsel]');
  const changed=e.target.closest('[data-changed]');
  const info=e.target.closest('[data-info]');
  if(info){openNumModal(info.dataset.label,info.dataset.value,{bday:info.dataset.bday,bmonth:info.dataset.bmonth});return;}
  if(e.target.id==='nummodal'){closeNumModal();return;}
  const nameChip=e.target.closest('[data-name]');
  const savedPair=e.target.closest('[data-savedpair]');
  if(nameChip){S.nm={name:nameChip.dataset.name,dob:(S.nm&&S.nm.dob)||''};save();render();window.scrollTo(0,0);return;}
  if(savedPair){const sp=(S.savedPairings||[])[+savedPair.dataset.savedpair];if(sp){S.compat={...sp};save();render();window.scrollTo(0,0);}return;}
  if(opt){toggleOpt(opt.dataset.opt);return;}
  if(rel){document.querySelectorAll('#fm_rel .opt').forEach(o=>o.classList.remove('sel'));rel.classList.add('sel');return;}
  if(rail){document.getElementById(rail.dataset.rail)?.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(fsel){const i=+fsel.dataset.fsel;let s=S.famSel||[];s=s.includes(i)?s.filter(x=>x!==i):[...s.slice(-1),i];S.famSel=s;save();render();return;}
  if(changed){alert('Noted: '+changed.dataset.changed+'. In the full build we\'d update your context here — never your core numbers.');return;}
  if(!a)return;const act=a.dataset.act;
  if(act==='num-close')closeNumModal();
  else if(act==='home')go('landing');
  else if(act==='login'||act==='auth')go('auth');
  else if(act==='do-auth'){S.account={name:val('ac_name'),email:val('ac_email')};save();go(hasMe()?'dashboard':'landing');}
  else if(act==='dashboard')go('dashboard');
  else if(act==='teaser')teaser();
  else if(act==='choose'){document.getElementById('pricing')?.scrollIntoView({behavior:'smooth'});}
  else if(act==='start-me'){S.journey='me';track('begin_checkout',{plan:'single',value:8.88});go('me_unlock');}
  else if(act==='start-fam'){S.journey='fam';track('begin_checkout',{plan:'family',value:28});go('fam_unlock');}
  else if(act==='unlocked-me'){track('purchase',{plan:'single',value:8.88,currency:'GBP'});go('me_dob');}
  else if(act==='unlocked-fam'){track('purchase',{plan:'family',value:28,currency:'GBP'});go('fam_anchor');}
  else if(act==='dob-next'){const v=document.getElementById('m_dob').value;if(!v){alert('Please choose your date of birth to continue — tap the date field above.');document.getElementById('m_dob').focus();return;}S.me.dob=v;save();go('me_name');}
  else if(act==='name-next'){S.me.first=val('n_first');S.me.middle=val('n_middle');S.me.last=val('n_last');S.me.currentName=val('n_current');if(!S.me.first||!S.me.last){alert('First name and surname help build your name profile.');return;}save();go('me_reveal');}
  else if(act==='go-deeper'){S.me.iStep=0;save();go('me_interview');}
  else if(act==='show-reading'){S.famReadingIdx=null;go('me_reading');}
  else if(act==='iq-next')iqNext(false);
  else if(act==='iq-skip')iqNext(true);
  else if(act==='build-reading'){S.famReadingIdx=null;go('me_reading');}
  else if(act==='save-done'){if(S.journey!=='fam'&&!S.upsellShown&&!(S.family&&S.family.length)){S.upsellShown=true;save();go('me_upsell');}else{save();go('dashboard');}}
  else if(act==='upsell-yes'){track('upsell_click',{plan:'family'});S.journey='fam';go('fam_unlock');}
  else if(act==='upsell-no')go('dashboard');
  else if(act==='open-reading'){S.famReadingIdx=null;go('me_reading');}
  else if(act==='fam-view-full'){S.famReadingIdx=+a.dataset.favidx;save();go('me_reading');}
  else if(act==='name-match')go('name_match');
  else if(act==='glossary')go('glossary');
  else if(act==='compat')go('compat');
  else if(act==='test-name'){S.nm={...(S.nm||{}),name:val('nm_name'),dob:val('nm_dob')};save();render();window.scrollTo(0,0);}
  else if(act==='nm-mode-match'){S.nm={...(S.nm||{}),mode:'match'};save();render();}
  else if(act==='nm-mode-complement'){S.nm={...(S.nm||{}),mode:'complement'};save();render();}
  else if(act==='nm-mode-number'){S.nm={...(S.nm||{}),mode:'number'};save();render();}
  else if(act.indexOf('nm-num-')===0){S.nm={...(S.nm||{}),mode:'number',targetNum:+act.slice(7)};save();render();}
  else if(act==='test-compat'){S.compat={name:val('cw_name'),dob:val('cw_dob')};save();render();window.scrollTo(0,0);}
  else if(act==='save-pairing'){const c=S.compat;if(c&&c.name&&c.dob){S.savedPairings=S.savedPairings||[];if(!S.savedPairings.some(x=>x.name===c.name&&x.dob===c.dob)){S.savedPairings.push({name:c.name,dob:c.dob});save();}render();}}
  else if(act==='reset'){if(confirm('This permanently erases everything saved on this device — your profile, your whole family, saved pairings and your account. It cannot be undone.\n\nClear all data and start fresh?')){clearAllData();alert('All data cleared. Starting fresh.');go('landing');}}
  else if(act==='anchor-me'){S.anchorEditMode=false;go('fam_add');}
  else if(act==='anchor-edit'){S.anchorEditMode=true;save();render();}
  else if(act==='anchor-cancel-edit'){S.anchorEditMode=false;save();render();}
  else if(act==='anchor-new'){const n=val('fa_name'),d=val('fa_dob');if(!n||!d){alert('Add your name and date of birth.');return;}S.me.first=n.split(' ')[0];S.me.last=n.split(' ').slice(1).join(' ')||n.split(' ')[0];S.me.dob=d;S.anchorEditMode=false;save();go('fam_add');}
  else if(act==='fm-add')fmAdd();
  else if(act==='fam-space')go('fam_space');
  else if(act==='fam-explore'||act==='fam-add-more'){if(act==='fam-explore'&&hasMe()&&!S.family.some(m=>m.relationship==='self')){S.family.unshift({name:fullName()||S.me.first,dob:S.me.dob,relationship:'self',door:S.me.door});save();}go('fam_space');}
});
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function toggleOpt(o){const q=currentIQ();if(!q)return;const c=S.me.context;if(q.multi){let arr=c[q.id]||[];if(arr.includes(o))arr=arr.filter(x=>x!==o);else{if(q.max&&arr.length>=q.max)arr=arr.slice(1);arr=[...arr,o];}c[q.id]=arr;}else{c[q.id]=o;}save();render();}
function iqNext(skip){const q=currentIQ();if(q&&(q.input||q.textarea)&&!skip){S.me.context[q.id]=val('iq_input');if(q.id==='door')S.me.door=val('iq_input');}S.me.iStep=(S.me.iStep||0)+1;save();if(S.me.iStep>=IQ.length)go('me_ready');else render();}
function fmAdd(){const n=val('fm_name'),d=val('fm_dob');const rel=document.querySelector('#fm_rel .opt.sel')?.dataset.rel||'other';if(!n||!d){alert('Add a name and date of birth.');return;}S.family.push({name:n,dob:d,relationship:rel});save();render();}
function teaser(){const v=document.getElementById('t_dob').value;if(!v){alert('Please choose your date of birth to continue — tap the date field above.');document.getElementById('t_dob').focus();return;}const lp=lifePathFromDob(v);const meta=npFor(lp.number);document.getElementById('t_reveal').classList.add('on');document.getElementById('t_kw').textContent=meta.m.split(',').slice(0,2).join(' ·');document.getElementById('t_mean').textContent='Your Life Path speaks to '+meta.m+'. But this is only one part of the picture.';S.me.dob=v;save();countTo(document.getElementById('t_num'),lp.number,lp.display);}
function countTo(el,target,disp){const dur=900;let s=null;const ease=t=>1-Math.pow(1-t,3);function step(ts){if(!s)s=ts;const p=Math.min((ts-s)/dur,1);el.textContent=Math.round(ease(p)*target);if(p<1)requestAnimationFrame(step);else el.textContent=disp||target;}requestAnimationFrame(step);}
function wireRail(){const ids=RSEC.map(r=>r[0]);const btns=[...document.querySelectorAll('.rail button')];const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){btns.forEach(b=>b.classList.toggle('on',b.dataset.rail===en.target.id));}}),{rootMargin:'-45% 0px -50% 0px'});ids.forEach(id=>{const el=document.getElementById(id);if(el)io.observe(el);});
  // animate key numbers with data-count
  document.querySelectorAll('[data-count]').forEach(el=>{if(el.dataset.count)countTo(el,+el.dataset.count,el.dataset.final);});}

/* first-reveal count animation (non-reading screens) */
const _origRender=render;
render=function(){_origRender();if(S.screen==='me_reveal'){document.querySelectorAll('[data-count]').forEach(el=>{if(el.dataset.count)countTo(el,+el.dataset.count,el.dataset.final);});}};

/* particles */
(function(){const c=document.getElementById('stars'),x=c.getContext('2d');let ps=[];const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const dpr=devicePixelRatio||1;
 function rs(){c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);ps=Array.from({length:110},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()*2.2+.6,a:Math.random()*.55+.35,tw:(Math.random()*.012+.005)*(Math.random()>.5?1:-1),c:Math.random()<.22?'110,231,183':(Math.random()<.5?'216,180,254':'167,139,250')}));}
 function draw(an){x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{if(an){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=innerWidth;if(p.x>innerWidth)p.x=0;if(p.y<0)p.y=innerHeight;if(p.y>innerHeight)p.y=0;p.a+=p.tw;if(p.a>.95||p.a<.15)p.tw*=-1;}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba('+p.c+','+p.a+')';x.fill();});}
 function loop(){draw(true);requestAnimationFrame(loop);}rs();addEventListener('resize',rs);reduce?draw(false):loop();})();

/* boot — resume if returning */
if(hasMe()&&(S.screen==='landing'||!S.screen))S.screen='dashboard';
render();
</script>
